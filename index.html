<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fork Flip</title>
<meta name="description" content="Fork Flip — call it in the air. Tines or Handle.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍴</text></svg>">
<style>
  :root{
    --bg:#0b0d10;
    --panel:#14181e;
    --line:#232a33;
    --ink:#e8edf4;
    --dim:#8b97a8;
    --steel:#c9d3df;
    --steel-dark:#7f8b9b;
    --win:#4ade80;
    --lose:#f87171;
    --gold:#f5c451;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b222c 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 18px 40px;
    -webkit-font-smoothing:antialiased;
  }
  header{text-align:center;margin-bottom:6px}
  h1{
    margin:0;
    font-size:clamp(28px,7vw,44px);
    letter-spacing:-.02em;
    font-weight:800;
  }
  h1 span{color:var(--gold)}
  .sub{color:var(--dim);font-size:14px;margin-top:4px}

  .stage{
    height:260px; width:100%; max-width:420px;
    display:grid; place-items:center;
    perspective:1000px;
  }
  .fork{
    width:120px; height:200px;
    transform-style:preserve-3d;
    position:relative;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));
  }
  .fork.flipping{ animation:flip var(--dur,1.9s) cubic-bezier(.15,.6,.2,1) forwards; }
  .fork.idle{ animation:bob 3.2s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotateY(12deg) rotateZ(-4deg)}
    50%{transform:translateY(-12px) rotateY(-12deg) rotateZ(4deg)}
  }
  @keyframes flip{
    0%{transform:translateY(0) rotateX(var(--start,0deg))}
    45%{transform:translateY(-120px) rotateX(var(--mid,900deg))}
    100%{transform:translateY(0) rotateX(var(--end,1800deg))}
  }
  .face{
    position:absolute; inset:0;
    display:grid; place-items:center;
    backface-visibility:hidden;
  }
  .face.back{ transform:rotateX(180deg) }
  .face svg{width:100%;height:100%}
  .tag{
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase;
  }

  .call{display:flex;gap:12px;margin:8px 0 18px;flex-wrap:wrap;justify-content:center}
  button{
    font:inherit; font-weight:650; color:var(--ink);
    background:var(--panel); border:1px solid var(--line);
    padding:13px 26px; border-radius:12px; cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  button:hover:not(:disabled){transform:translateY(-2px);border-color:#3b4655;background:#1a1f26}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{border-color:#4a3f1c;background:#1e1a10;color:var(--gold)}
  button.primary:hover:not(:disabled){border-color:var(--gold);background:#241f13}

  .result{
    min-height:34px; font-size:19px; font-weight:700; letter-spacing:-.01em;
    text-align:center;
  }
  .result.win{color:var(--win)}
  .result.lose{color:var(--lose)}
  .result .quiet{color:var(--dim);font-weight:500;font-size:15px}

  .stats{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    width:100%; max-width:460px; margin-top:22px;
  }
  .stat{
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:12px 8px; text-align:center;
  }
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

  .log{
    width:100%;max-width:460px;margin-top:16px;
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:24px;
  }
  .pip{
    width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
    font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--dim);
  }
  .pip.w{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.35);color:var(--win)}
  .pip.l{background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.3);color:var(--lose)}

  footer{margin-top:26px;color:var(--dim);font-size:12px;text-align:center}
  footer a{color:var(--dim)}
  .reset{margin-top:14px;font-size:12px;padding:7px 14px;border-radius:9px}
  @media (prefers-reduced-motion:reduce){
    .fork.idle{animation:none}
    .fork.flipping{animation-duration:.3s}
  }
</style>
</head>
<body>

<header>
  <h1>Fork <span>Flip</span></h1>
  <p class="sub">Call it in the air. Tines or handle.</p>
</header>

<div class="stage">
  <div class="fork idle" id="fork">
    <div class="face front">
      <svg viewBox="0 0 60 100" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7f8b9b"/>
            <stop offset="42%" stop-color="#eaf1f8"/>
            <stop offset="60%" stop-color="#c9d3df"/>
            <stop offset="100%" stop-color="#6d7887"/>
          </linearGradient>
        </defs>
        <g fill="url(#g1)">
          <rect x="17" y="6"  width="4.4" height="26" rx="2.2"/>
          <rect x="24.5" y="4" width="4.4" height="28" rx="2.2"/>
          <rect x="32" y="4"  width="4.4" height="28" rx="2.2"/>
          <rect x="39.5" y="6" width="4.4" height="26" rx="2.2"/>
          <path d="M15 30 h30 c0 12 -6 14 -10 16 v44 a5 5 0 0 1 -10 0 v-44 c-4 -2 -10 -4 -10 -16 z"/>
        </g>
      </svg>
      <div class="tag">tines</div>
    </div>
    <div class="face back">
      <svg viewBox="0 0 60 100" aria-hidden="true">
        <defs>
          <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6d7887"/>
            <stop offset="40%" stop-color="#c9d3df"/>
            <stop offset="58%" stop-color="#9aa6b5"/>
            <stop offset="100%" stop-color="#5c6674"/>
          </linearGradient>
        </defs>
        <g fill="url(#g2)">
          <path d="M23 4 h14 a6 6 0 0 1 6 6 v18 a13 13 0 0 1 -6 11 v51 a7 7 0 0 1 -14 0 v-51 a13 13 0 0 1 -6 -11 v-18 a6 6 0 0 1 6 -6 z"/>
        </g>
      </svg>
      <div class="tag">handle</div>
    </div>
  </div>
</div>

<div class="call">
  <button id="btnTines">Call Tines</button>
  <button id="btnHandle">Call Handle</button>
</div>

<div class="result" id="result"><span class="quiet">Make your call.</span></div>

<div class="stats">
  <div class="stat"><b id="sWins">0</b><span>Wins</span></div>
  <div class="stat"><b id="sFlips">0</b><span>Flips</span></div>
  <div class="stat"><b id="sStreak">0</b><span>Streak</span></div>
  <div class="stat"><b id="sBest">0</b><span>Best</span></div>
</div>

<div class="log" id="log"></div>

<button class="reset" id="btnReset">Reset stats</button>

<footer>
  50/50, no house edge, no wallet. Just a fork.<br>
  <a href="https://github.com/The-Trenches-Team/fork-flip">source on github</a>
</footer>

<script>
(function(){
  const fork    = document.getElementById('fork');
  const result  = document.getElementById('result');
  const log     = document.getElementById('log');
  const btnT    = document.getElementById('btnTines');
  const btnH    = document.getElementById('btnHandle');
  const btnR    = document.getElementById('btnReset');
  const KEY     = 'forkflip.v1';

  const blank = { wins:0, flips:0, streak:0, best:0, recent:[] };
  let s = load();
  render();

  function load(){
    try{
      const raw = JSON.parse(localStorage.getItem(KEY));
      if(!raw || typeof raw !== 'object') return {...blank};
      return {...blank, ...raw, recent: Array.isArray(raw.recent) ? raw.recent.slice(-20) : []};
    }catch(e){ return {...blank}; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  }

  function render(){
    document.getElementById('sWins').textContent   = s.wins;
    document.getElementById('sFlips').textContent  = s.flips;
    document.getElementById('sStreak').textContent = s.streak;
    document.getElementById('sBest').textContent   = s.best;
    log.innerHTML = '';
    s.recent.forEach(w => {
      const d = document.createElement('div');
      d.className = 'pip ' + (w ? 'w' : 'l');
      d.textContent = w ? 'W' : 'L';
      log.appendChild(d);
    });
  }

  // Cryptographically fair 50/50 — no Math.random bias games.
  function coin(){
    if(window.crypto && crypto.getRandomValues){
      const a = new Uint8Array(1);
      do { crypto.getRandomValues(a); } while(a[0] === 255); // reject the odd byte out
      return a[0] % 2 === 0 ? 'tines' : 'handle';
    }
    return Math.random() < 0.5 ? 'tines' : 'handle';
  }

  let busy = false;
  let resting = 0; // current rotateX resting angle, keeps the animation continuous

  function flip(call){
    if(busy) return;
    busy = true;
    btnT.disabled = btnH.disabled = true;
    result.innerHTML = '<span class="quiet">In the air…</span>';
    result.className = 'result';

    const outcome = coin();
    // land on a multiple of 360 for tines, 180 offset for handle
    const spins = 4 + Math.floor(Math.random()*3);
    const end   = resting + spins*360 + (outcome === 'handle' ? 180 : 0)
                  - (resting % 360);
    fork.classList.remove('idle');
    fork.style.setProperty('--start', resting + 'deg');
    fork.style.setProperty('--mid', (resting + spins*180) + 'deg');
    fork.style.setProperty('--end', end + 'deg');
    fork.classList.remove('flipping');
    void fork.offsetWidth;           // restart the animation
    fork.classList.add('flipping');

    setTimeout(() => {
      resting = end;
      const won = outcome === call;
      s.flips++;
      if(won){
        s.wins++;
        s.streak++;
        if(s.streak > s.best) s.best = s.streak;
      } else {
        s.streak = 0;
      }
      s.recent.push(won);
      if(s.recent.length > 20) s.recent.shift();
      save();
      render();

      result.className = 'result ' + (won ? 'win' : 'lose');
      const face = outcome === 'tines' ? 'Tines' : 'Handle';
      result.innerHTML = won
        ? face + '. You called it.' + (s.streak > 2 ? ' <span class="quiet">' + s.streak + ' in a row.</span>' : '')
        : face + '. Not your flip.';

      busy = false;
      btnT.disabled = btnH.disabled = false;
    }, 1950);
  }

  btnT.addEventListener('click', () => flip('tines'));
  btnH.addEventListener('click', () => flip('handle'));
  btnR.addEventListener('click', () => { s = {...blank}; save(); render();
    result.className = 'result';
    result.innerHTML = '<span class="quiet">Make your call.</span>';
  });

  document.addEventListener('keydown', e => {
    if(e.key === 't' || e.key === 'T') flip('tines');
    if(e.key === 'h' || e.key === 'H') flip('handle');
  });
})();
</script>
</body>
</html>
